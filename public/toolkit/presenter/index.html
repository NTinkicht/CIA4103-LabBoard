<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#121e31">
<title>Files & Slides — Classroom Toolkit</title>
<meta name="description" content="Show PDF and PowerPoint slides privately, with navigation and fullscreen presentation mode.">
<link rel="stylesheet" href="/assets/toolkit-presenter.css">
<script type="module" src="/assets/toolkit-presenter.mjs"></script>
</head>
<body>
<main class="presenter-app">
<header class="toolbar">
 <div class="identity"><span class="logo" aria-hidden="true">▧</span><div><strong>Files & Slides</strong><small>PowerPoint and PDF viewer</small></div></div>
 <div class="actions">
  <label class="file-button" for="upload">＋ Add PowerPoint / PDF</label>
  <input id="upload" type="file" accept=".pptx,.ppt,.pdf,application/pdf,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.ms-powerpoint" hidden>
  <button type="button" id="fullscreen" class="primary">⛶ Fullscreen</button>
 </div>
</header>
<section class="library-bar"><label for="documents">My classroom files</label><select id="documents" aria-label="Choose a saved presentation"><option value="">Select a file</option></select><button id="delete" type="button" disabled>Remove</button><span class="help">Files stored only in this browser</span></section>
<section class="presentation" id="presentation" aria-label="Slide presentation area" tabindex="0">
 <div class="viewer" id="viewer"><div id="placeholder"><span>▧</span><h1>Present your slides.</h1><p>Choose a PowerPoint or PDF to display it here.<br>Use the fullscreen button or press F to present.</p></div></div>
 <div class="slide-control" id="slide-controls" hidden>
  <button type="button" id="previous" aria-label="Previous slide">← Previous</button>
  <span id="counter" aria-live="polite">Slide 0 of 0</span>
  <button type="button" id="next" aria-label="Next slide">Next →</button>
 </div>
</section>
<div class="message" id="status" role="status" aria-live="polite">Ready. Your files never leave this browser.</div>
</main>
</body></html>
