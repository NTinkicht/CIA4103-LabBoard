name: Classroom Toolkit Tests
on:
  pull_request:
    paths:
      - 'netlify/functions/toolkit.mjs'
      - 'public/assets/toolkit-app.mjs'
      - 'public/assets/toolkit.css'
      - 'public/toolkit/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/toolkit-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --check public/assets/toolkit-app.mjs
      - run: node --check netlify/functions/toolkit.mjs
      - run: node --check netlify/functions/whiteboard-elements.mjs
      - run: node --check public/assets/toolkit-presenter.mjs
      - run: node --check public/assets/toolkit-whiteboard.mjs
      - run: node --check public/assets/toolkit-cloud.mjs
      - run: node --check public/assets/toolkit-web-browser.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright-core@1.56.1
      - name: Browser PPTX and fullscreen smoke test
        run: |
          echo "Chrome: $(command -v google-chrome || true)"
          node tests/toolkit-browser-smoke.mjs
          node tests/toolkit-whiteboard-browser.mjs
          node tests/toolkit-cloud-browser.mjs
          node tests/toolkit-activity-tabs-browser.mjs
          node tests/toolkit-web-browser-browser.mjs
