[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/posts"
  to = "/.netlify/functions/posts"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'sha256-wA4MIusTvVhcKz46KA9v32qcjgRdyBATgxPTIUN56To=' 'sha256-CzFVoLldfvWQeGZ5PO1ccf3DUpo+oj1xddGzfP+N+uI='; connect-src 'self'; img-src 'self' data:; font-src 'self'"
